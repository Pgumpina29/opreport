services:
  - type: web
    name: opreport
    runtime: python
    pythonVersion: 3.14
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        scope: run_and_build
        sync: false
    databases:
      - name: section_cases
        databaseName: section_cases
        user: section_user
        plan: free
